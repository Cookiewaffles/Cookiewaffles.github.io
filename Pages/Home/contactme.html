<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portoflio - Contact Me</title>

    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/form.css" />

    <!--Font Awesome loading-->
    <script src="https://kit.fontawesome.com/acd873c10d.js" crossorigin="anonymous"></script>

    <script src="../../js/headerFooter.js" defer></script>
    <script src="../../js/form.js" defer></script>

     <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js">
    </script>

    <script type="text/javascript">
    (function(){
        emailjs.init({
            publicKey: "JUFOW_ZN1qtJnZTx5",
            limitRate: {
                // Set the limit rate for the application
                id: 'app',
                // Allow 1 request per 10s
                throttle: 10000,
            },
        });
    })();
    </script>
</head>

<body>
    <my-header></my-header>
    <main>
        <h1>Contact Me : </h1>
        
        <p>Want to discuss something with me? Such as a possible oppurnity or feedback on my skillsets then fill out this form and click submit. I'll get back to you as soon as I can. Thank you for your time!</p>

        <div class="form-container">
            <form id="feedbackSubmission">
                <div>
                    <label for="name">Username :</label>
                    <input type="text" id="name" name="name" placeholder="e.g. janesmith" required>
                </div>
                
                <div>
                    <label for="email">Email Address :</label>
                    <input type="email" id="email" name="email" placeholder="email@gmail.com" required>
                </div>

                <div>
                    <label for="subject">Subject :</label>
                    <input type="text" id="subject" name="subject" placeholder="Reason for contacting..." required>
                </div>
                
                <div>
                    <label for="message">Feedback :</label>
                    <textarea id="message" name="message" placeholder="Your message here..." required></textarea>
                </div>
                
                <div>
                    <button class="btn" onclick="sendEmail()">Submit</button>
                </div>
            </form>
        </div>
    </main>
    <my-footer></my-footer>
</body>
</html>
