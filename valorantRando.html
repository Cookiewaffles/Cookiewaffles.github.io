<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portoflio - Home</title>

    <link rel="stylesheet" href="css/val_styles.css" />

    <!--Font Awesome loading-->
    <link
      rel="stylesheet preload"
      href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
      integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr"
      crossorigin="anonymous"
      as="style"
    />

    <script src="js/headerFooter.js" defer></script>
    <script src="js/valorant.js" defer></script> 
</head>

<body>
    <main>
        <valo-header></valo-header>
        <div class="interactiveZone">
            <section id="setupMenu" class="span-1">
                <div id="agentSetup">
                    <label class="flex-30 margin-20-right" for="agentSelect">Agent Select :</label>
                    <select class="flex-70" name="agentValue" id="agentSelect">
                        <option value="">--Choose an Option--</option>
                    </select>
                </div>

                <div id="mapSetup">
                    <label class="flex-30 margin-20-right" for="mapSelect">Map Select :</label>
                    <select class="flex-70" name="mapValue" id="mapSelect">
                        <option value="">--Choose an Option--</option>
                    </select>
                </div>

                <div id="moneySection">
                    <div id="moneySetup">
                        <label class="flex-30 padding-20-right" for="currMoney">Money :</label>
                        <input class="flex-70" type="number" id="currMoney" name="valueOfMoney" value="800" />
                    </div>

                    <div class="money-helper">
                        <div><p>Spending : </p></div>
                        <div><p id="spendMoney">0000</p></div>
                        <div><p>Last Round : </p></div>
                        <div><p id="prevMoney">0000</p></div>
                    </div>

                    <div class="reset-button">
                        <button>Reset</button>
                    </div>
                </div>
            </section>
            <div class="span-3">
                <section id="gunSelection">
                    <div id="loadoutTitle">
                        <h2>Loadout : </h2>
                    </div>
                    <div id="primaryGun">
                        <h3 class="flex-30 flex-end">Primary : </h3>
                        <p class="flex-70 flex-center">?Gun?</p>
                    </div>
                    <div id="pistolGun">
                        <h3 class="flex-30 flex-end">Pistol : </h3>
                        <p class="flex-70 flex-center">?Gun?</p>
                    </div>
                    <div id="shield">
                        <h3 class="flex-30 flex-end">Shield : </h3>
                        <p class="flex-70 flex-center">?Shield?</p>
                    </div>
                </section>

                <section id="abilitySelection">
                    <h2>Abilities : </h2>
                    <div>
                        <img src="images/x.png" alt="An letter X" />
                        <img src="images/x.png" alt="An letter X" />
                        <img src="images/x.png" alt="An letter X" />
                    </div>
                </section>
            </div>

            <section id="strategySelection" class="span-2">
                <h2>Strategy : </h2>
                <p>???</p>
            </section>

            <section id="secretSelection"  class="span-2">
                <h2>Secret Task : </h2>
                <p>???</p>
            </section>
        </div>
        <div>
            <section id="roundResults">
                <button>Round Win <br> (Survived)</button>
                <button>Round Win <br> (Died)</button>
                <button>Enemy Kill <br> (+1)</button>
                <button>Round Lost <br> (Survived)</button>
                <button>Round Lost <br> (Died)</button>
                <button>Spike <br> Planted</button>
            </section>
        </div>
    </main>
</body>
